name: Unpack verified Phase 0/1 source bundle

on:
  push:
    branches:
      - "phase-0-1/source-transfer"
    paths:
      - "bootstrap/geologia-phase-0-1.zip"

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "phase-0-1/source-transfer"
          persist-credentials: true

      - name: Validate archive paths and required source files
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "bootstrap/geologia-phase-0-1.zip"
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
              names = set(zf.namelist())
              required = {
                  "pyproject.toml",
                  "apps/api/app/main.py",
                  "tests/test_upload_analysis.py",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"Required source files missing: {sorted(missing)}")
              bad = [n for n in names if "__pycache__" in n or n.endswith(".pyc") or ".egg-info/" in n]
              if bad:
                  raise SystemExit(f"Generated artifacts found: {bad[:10]}")
          PY

      - name: Extract source tree
        run: |
          mkdir -p /tmp/geologia-source
          unzip -q bootstrap/geologia-phase-0-1.zip -d /tmp/geologia-source
          cp -a /tmp/geologia-source/. .
          test -f apps/api/app/main.py
          test -f tests/test_upload_analysis.py

      - name: Commit source transfer to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Transfer verified GEOLOGIA Phase 0/1 source tree"
          git push origin HEAD:phase-0-1/source-transfer
