name: GEOLOGIA Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build release binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,pdf]"
      - name: Build one-file desktop executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name geologia-desktop --collect-all geologia scripts/geologia_desktop.py
      - name: Smoke test executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/geologia-desktop.exe --version
            python scripts/smoke_desktop.py dist/geologia-desktop.exe
            cp dist/geologia-desktop.exe "dist/geologia-desktop-${RUNNER_OS}-${RUNNER_ARCH}.exe"
          else
            ./dist/geologia-desktop --version
            python scripts/smoke_desktop.py dist/geologia-desktop
            cp dist/geologia-desktop "dist/geologia-desktop-${RUNNER_OS}-${RUNNER_ARCH}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: geologia-desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/geologia-desktop-${{ runner.os }}-${{ runner.arch }}*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tagged GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geologia-desktop-*
          merge-multiple: true
          path: release-assets
      - name: Generate SHA-256 checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "GEOLOGIA $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
