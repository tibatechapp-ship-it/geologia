name: GEOLOGIA CI
on:
  push:
    branches: [main, "phase-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis]"
      - run: node --check src/geologia/web/app.js
      - run: python -m ruff check src tests
      - run: python -m compileall -q src tests
      - run: python -m pytest
