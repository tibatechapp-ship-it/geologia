name: GEOLOGIA CI
on:
  push:
    branches: [main, "phase-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Stable Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis]"
      - run: node --check src/geologia/web/app.js
      - run: python -m ruff check src tests
      - run: python -m compileall -q src tests
      - run: python -m pytest

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install Python runtime in Playwright container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/geologia-venv
          echo "/tmp/geologia-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis]"
      - run: npm install --no-package-lock
      - run: npm run test:e2e
        env:
          CI: "true"

  format-validation:
    name: Real geospatial format fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis,formats]"
      - run: python -m ruff check src tests
      - run: python -m pytest tests/test_formats.py
