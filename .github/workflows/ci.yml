name: GEOLOGIA CI
on:
  push:
    branches: [main, "phase-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Stable Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis,pdf]"
      - run: node --check src/geologia/web/app.js
      - run: python -m ruff check src tests
      - run: python -m compileall -q src tests
      - run: python -m pytest

  format-parser-tests:
    name: Optional geospatial format parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis,formats]"
      - run: >-
          python -m pytest
          tests/test_formats.py
          tests/test_dem_raster_coverage_inspection.py
          tests/test_dem_tile_collection_coverage.py
          tests/test_dem_accuracy.py
          tests/test_api_dem_accuracy.py
          tests/test_api_dem_coverage.py
          -q

  browser-e2e:
    name: Chromium claim/evidence workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q

  desktop-changes:
    name: Detect desktop packaging changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^(src/geologia/.*|scripts/geologia_desktop\.py|scripts/smoke_desktop\.py|pyproject\.toml|\.github/workflows/desktop-build\.yml|\.github/workflows/ci\.yml|tests/test_desktop\.py)$'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-package-check:
    name: Desktop binary (${{ matrix.os }})
    needs: desktop-changes
    if: github.event_name == 'pull_request' && needs.desktop-changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[build,pdf]"
      - run: python -m PyInstaller --noconfirm --clean --onefile --name geologia-desktop --collect-all geologia scripts/geologia_desktop.py
      - name: Smoke test executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/geologia-desktop.exe --version
          else
            ./dist/geologia-desktop --version
          fi
      - name: Smoke test packaged HTTP server and web assets
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/smoke_desktop.py dist/geologia-desktop.exe
          else
            python scripts/smoke_desktop.py dist/geologia-desktop
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: geologia-desktop-pr-${{ runner.os }}-${{ runner.arch }}
          path: dist/geologia-desktop*
          if-no-files-found: error
          retention-days: 14
