[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geologia"
version = "0.1.0"
description = "Bilingual open-source geoscience platform foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110,<0.128", "pydantic>=2.7,<3.0", "uvicorn>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "httpx>=0.24,<0.28", "ruff>=0.5,<1"]
gis = ["pyproj>=3.6,<4"]
pdf = ["pypdf>=5.0,<7"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
geologia-api = "geologia.api:run"
geologia-knowledge = "geologia.knowledge_cli:main"
geologia-desktop = "geologia.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geologia = ["data/*.json", "data/knowledge_seed/*.md", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
