[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geologia"
version = "0.1.0"
description = "Bilingual open-source geoscience platform foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<0.128", "pydantic>=1.10.17,<2.0", "uvicorn>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "httpx>=0.24,<0.28", "ruff>=0.5,<1"]

[project.scripts]
geologia-api = "geologia.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geologia = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
